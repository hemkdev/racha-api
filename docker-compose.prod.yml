services:
  app:
    image: ghcr.io/hemkdev/racha-api:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      # manage.py defaults to dev; wsgi.py already points to prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # The release tag the deploy exported; shows up as the version in the API docs.
      APP_VERSION: ${IMAGE_TAG:-dev}
    restart: unless-stopped

  web:
    image: ghcr.io/hemkdev/racha-api-web:${IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    depends_on:
      - app
    ports:
      # Loopback only: the Cloudflare tunnel on the host is the single way in.
      - "127.0.0.1:8080:80"
    restart: unless-stopped

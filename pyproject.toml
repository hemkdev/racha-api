[project]
name = "racha-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hemkdev", email = "lucas.hemkemeier007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django~=5.2.0",
    "django-environ~=0.12",
    "gunicorn~=23.0",
    "psycopg[binary]~=3.3.4",
    "djangorestframework~=3.18.0",
]

[dependency-groups]
dev = [
    "ruff~=0.16.5",
    "pytest-django==4.14.0",
    "pytest==9.1.1",
]

[tool.ruff]
# Migrations are generated by Django; linting them means fighting the generator.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django settings are split into modules that re-export the base ones
"config/settings/*" = ["F403", "F405"]
# Ignore the RUF012 in all models.py
"**/models.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
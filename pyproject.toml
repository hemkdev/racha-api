[project]
name = "racha-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hemkdev", email = "lucas.hemkemeier007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django~=5.2.0",
    "django-environ~=0.12",
    "gunicorn~=23.0",
    "psycopg[binary]~=3.3.4",
]

[dependency-groups]
dev = [
    "ruff~=0.14",
]

[tool.ruff]
# Migrations are generated by Django; linting them means fighting the generator.
extend-exclude = ["*/migrations/*"]

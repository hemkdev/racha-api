services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: racha
      POSTGRES_USER: racha
      POSTGRES_PASSWORD: racha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racha -d racha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
